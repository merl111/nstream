# Nixpacks (Coolify / Railway): build the Vite SPA, embed into Go, ship ffmpeg for HLS.
# Coolify: Application → GitHub → Build pack Nixpacks → set port 8080, env vars, volume for NSTREAM_DB.

providers = ["go"]

[phases.setup]
# Nixpacks pins nixpkgs without nodejs_22; nodejs_20 is present there and works for the Vite build.
nixPkgs = ["...", "nodejs_20", "ffmpeg"]

[phases.install]
cmds = ["...", "cd web && npm ci"]

[phases.build]
dependsOn = ["install"]
cmds = [
  "cd web && npm run build",
  "go build -o nstream ./cmd/nstream",
]

[start]
cmd = "./nstream"
